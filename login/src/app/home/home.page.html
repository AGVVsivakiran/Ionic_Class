<ion-content [fullscreen]="true">
 <ion-card>
   <form [formGroup]="form">

    <div class="ion-text-center ion-margin-vertical lock">
      <ion-icon name="lock-closed"></ion-icon>
    </div>


     <ion-item class="ion-margin" lines="none">
      <ion-button slot="start" fill="clear" color="medium" shape="circle">
       <ion-icon slot="icon-only" name="mail-outline"></ion-icon>
     </ion-button>
 
      <ion-input lines="none" 
       labelPlacement="floating"
       type="email"
       formControlName="email"
       placeholder="Enter email address"
       errorText="* Enter proper email address">
       
       <div slot="label">Email <ion-text color="danger">*</ion-text></div>
      </ion-input>
     </ion-item>

     <ion-item class="ion-margin" lines="none">
      <ion-button slot="start" fill="clear" color="dark">
        <ion-icon slot="icon-only" name="key-outline"></ion-icon>
      </ion-button>
      <ion-input labelPlacement="floating"
      [type]="isPwd ? 'text' : 'password'"
      placeholder="Enter password"
      formControlName="password"
      [errorText]="form!.get('password')!.hasError('minlength') ? '* Password must be min 8 character long' : '* Enter a proper password'">
      <div slot="label">Password <ion-text color="danger">*</ion-text></div>
    </ion-input>
    <ion-button slot="end" fill="clear" color="danger" (click)="togglePwd()">
      <ion-icon slot="icon-only" [name]="isPwd ? 'eye-outline' :'eye-outline'"></ion-icon> 
    </ion-button>
     </ion-item> 

     <div class="ion-text-right ion-marin-horizontal">
      <ion-text class="fwd" color="dark">Forgot Password?</ion-text>
     </div>

     <div class="ion-margin submit" (click)="onSubmit()">
      <ion-button expand="block" size="large">
        <ion-text><Strong>Log In</Strong></ion-text>
      </ion-button>
     </div>

     
   </form>
 </ion-card>
</ion-content>
